<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>線上體驗｜源程序：真實畫面，示範資料</title>
<link rel="icon" href="assets/logo.png">
<meta name="robots" content="noindex,nofollow">
<meta name="description" content="用真實系統的畫面操作民眾端與後台：預約、報名、訂購、集點卡、優惠券、號碼牌。資料都是示範用的，民眾端按下去，後台立刻同步。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@600;700;900&family=Noto+Sans+TC:wght@400;500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="demo.css?v=20261003a">
</head>
<body>

<header class="dh">
  <a href="index.html" class="dh-brand"><img src="assets/logo-mark-dark.jpg" alt="源程序標誌" height="36"><span>源程序<small>線上體驗</small></span></a>
  <a href="index.html#contact" class="dh-cta">我想要這樣的系統</a>
</header>

<main class="dm">
  <div class="intro">
    <h1>這就是客戶會用到的系統</h1>
    <p>左邊是客人在 LINE 裡看到的畫面，右邊是店家的後台。畫面是<b>真實系統</b>，裡面的店家與資料都是<b>示範用的虛構內容</b>，不會連到任何真實資料。</p>
    <p class="hint">試試看：在左邊預約、報名、訂購、集點，再到右邊後台看「剛剛那筆」。</p>
  </div>

  <div class="tools" aria-label="示範操作">
    <div class="tool-group">
      <span class="tool-label">客人端快速前往</span>
      <button type="button" data-go="/">首頁</button>
      <button type="button" data-go="/book/studio-booking">預約體驗</button>
      <button type="button" data-go="/register/studio-course">課程報名</button>
      <button type="button" data-go="/shop/studio-shop">保養品選購</button>
      <button type="button" data-go="/case/studio-service">售後服務</button>
      <button type="button" data-go="/me">我的申請</button>
      <button type="button" data-go="/loyalty">集點卡</button>
      <button type="button" data-go="/coupons">優惠券</button>
      <button type="button" data-go="/tickets">號碼牌</button>
      <button type="button" data-go="/assistant">問問</button>
    </div>
    <div class="tool-group">
      <span class="tool-label">模擬現場</span>
      <button type="button" class="hot" id="btnScan">掃現場 QR 集點</button>
      <button type="button" class="hot" id="btnTicket">掃現場 QR 領號碼牌</button>
      <button type="button" id="btnReset">重新開始</button>
    </div>
  </div>

  <div class="switch" role="tablist" aria-label="切換畫面">
    <button type="button" class="on" data-pane="phone" role="tab">客人（LINE）</button>
    <button type="button" data-pane="admin" role="tab">店家後台</button>
  </div>

  <div class="stage">
    <section class="pane pane-phone on" id="paneP" aria-label="民眾端示範">
      <div class="phone-shell">
        <div class="notch"></div>
        <iframe id="phone" title="民眾端：LINE 裡的服務頁面" src="app/demo.html?pane=citizen&v=20261003a" loading="lazy"></iframe>
      </div>
      <p class="cap">客人端：LINE 裡的服務頁面</p>
    </section>

    <section class="pane pane-admin" id="paneA" aria-label="後台示範">
      <div class="win">
        <div class="win-bar"><i></i><i></i><i></i><span>店家後台（示範）</span><em id="syncNote" aria-live="polite"></em></div>
        <iframe id="admin" title="店家後台" src="app/demo.html?pane=admin&v=20261003a" loading="lazy"></iframe>
      </div>
      <p class="cap">後台：員工在電腦或手機上看到的畫面（客人端有動作，這裡會自動更新）</p>
    </section>
  </div>

  <p class="foot">展示用的是「美學」風格，其他風格與顏色可以在後台自己調。想看哪一塊、想知道怎麼套到你的生意，<a href="index.html#contact">跟我們聊聊</a>。</p>
</main>

<script src="demo.js?v=20261003a"></script>
</body>
</html>
